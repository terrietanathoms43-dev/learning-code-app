name: Install Sandbox Dependency

on:
  push:
    paths:
      - ".github/workflows/install-sandbox-dependency.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel Sandbox SDK
        run: npm install @vercel/sandbox@latest --save --ignore-scripts
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "build: add Vercel Sandbox SDK"
            git push origin HEAD:main
          fi

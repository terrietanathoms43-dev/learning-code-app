name: One-time Next.js security upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-next-security.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upgrade patched Next.js packages
        run: npm install next@16.4.0 eslint-config-next@16.4.0 --save-exact
      - name: Verify patched dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git commit -m "security: upgrade Next.js to 16.4.0"
          git push

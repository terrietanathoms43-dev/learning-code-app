name: Browser E2E

on:
  workflow_dispatch:

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://learning-code-app.vercel.app
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser tests
        run: npx playwright test --config=e2e/playwright.config.mjs

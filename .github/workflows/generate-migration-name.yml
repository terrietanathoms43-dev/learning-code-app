name: Generate Supabase migration name

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-migration-name.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1.7.0
        with:
          version: 2.117.0
      - name: Generate migration name
        run: |
          supabase migration new javascript_foundations
          find supabase/migrations -maxdepth 1 -type f -name '*javascript_foundations.sql' -print
